<!--
  Original URL: https://bruno-simon.com/
  Recreation by: Claude Opus 4.7

  What makes Bruno Simon's site iconic:
    • A 3D toy-world portfolio — you literally DRIVE a tiny car around to explore
      Bruno's work, awards, and contact info. The "site" IS the interaction.
    • Toy-block aesthetic: flat saturated colors, wooden ramps with diagonal grain,
      red brick walls, oversized signs, crayon-style ground labels.
    • Friendly intro overlay: BRUNO SIMON / Creative Developer, then a control prompt
      ("Use arrow keys to move"), which fades away the moment you start driving.
    • Cartoony top-down chase camera with very forgiving physics — the car feels
      springy, weighty, and just always fun to throw around.
    • Color palette: pastel sky, vivid grass green, warm wood, orange-red car,
      strong shadow-flat surfaces (toon-ish without being literally toon-shaded).

  Challenges solved in this single-file recreation:
    1. Cannon.js / cannon-es is heavy; I rolled a small bespoke car driving model
       (input → acceleration → friction → steering angular velocity → world XY
       position) that mimics the springy toy feel without a physics library.
    2. AABB-vs-AABB sliding collision against walls/ramps for forgiving "bump
       and slide" behaviour — never trapping the car.
    3. Ramps detected via XZ-overlap; car visually rises along the ramp normal
       so it can drive UP wooden platforms (same trick Bruno uses for chairs/ramps).
    4. Floor signs are canvas-textured planes rotated flat on the ground —
       gives the crayon-on-grass handwriting feel without any image assets.
    5. Tutorial overlay auto-dismisses on first input (keyboard or touch joystick).
    6. Touch joystick for mobile, keyboard arrows/WASD for desktop.
    7. Pixel-ratio capped at 2 and frustum-friendly lighting for a buttery framerate.
-->

<script type="importmap">
{
  "imports": {
    "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
    "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"

<script type="module">
import * as THREE from 'three';

/* ===========================================================
   SCENE / CAMERA / RENDERER
   =========================================================== */
const scene = new THREE.Scene();
scene.background = new THREE.Color(0xc0e8ff);
scene.fog = new THREE.Fog(0xc0e8ff, 90, 200);

const camera = new THREE.PerspectiveCamera(50, window.innerWidth / window.innerHeight, 0.1, 500);
camera.position.set(0, 22, 28);
camera.lookAt(0, 0, 0);

const renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: 'high-performance' });
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.outputColorSpace = THREE.SRGBColorSpace;
document.body.appendChild(renderer.domElement);

/* ===========================================================
   LIGHTING
   =========================================================== */
scene.add(new THREE.HemisphereLight(0xffffff, 0x8fbf68, 0.85));

const sun = new THREE.DirectionalLight(0xfff3d0, 1.2);
sun.position.set(30, 50, 25);
sun.castShadow = true;
sun.shadow.mapSize.set(2048, 2048);
sun.shadow.camera.left = -60;
sun.shadow.camera.right = 60;
sun.shadow.camera.top = 60;
sun.shadow.camera.bottom = -60;
sun.shadow.camera.near = 1;
sun.shadow.camera.far = 160;
sun.shadow.bias = -0.0005;
scene.add(sun);

/* ===========================================================
   GROUND
   =========================================================== */
const grassMat = new THREE.MeshLambertMaterial({ color: 0x7bc25b });

// Subtle grid lines drawn into the grass via a custom canvas texture
function makeGrassTexture() {
  const size = 512;
  const c = document.createElement('canvas');
  c.width = c.height = size;
  const ctx = c.getContext('2d');
  ctx.fillStyle = '#7bc25b';
  ctx.fillRect(0, 0, size, size);
  // soft noise speckles
  for (let i = 0; i < 1200; i++) {
    ctx.fillStyle = `rgba(${60 + Math.random()*40},${150 + Math.random()*40},${60 + Math.random()*40},${0.18 + Math.random()*0.15})`;
    const x = Math.random()*size, y = Math.random()*size, r = 1 + Math.random()*2;
    ctx.beginPath(); ctx.arc(x, y, r, 0, Math.PI*2); ctx.fill();
  }
  const tex = new THREE.CanvasTexture(c);
  tex.wrapS = tex.wrapT = THREE.RepeatWrapping;
  tex.repeat.set(40, 40);
  tex.colorSpace = THREE.SRGBColorSpace;
  return tex;
}

const grass = new THREE.Mesh(
  new THREE.PlaneGeometry(300, 300),
  new THREE.MeshLambertMaterial({ map: makeGrassTexture() })
);
grass.rotation.x = -Math.PI / 2;
grass.receiveShadow = true;
scene.add(grass);

/* ===========================================================
   FLOOR LABEL (crayon-style writing on the grass)
   =========================================================== */
function makeFloorLabel(text, opts = {}) {
  const { width = 12, scale = 1, color = '#1c1c2e', size = 96 } = opts;
  const ratio = 2.6;
  const w = 1024, h = Math.round(1024 / ratio);
  const c = document.createElement('canvas');
  c.width = w; c.height = h;
  const ctx = c.getContext('2d');
  ctx.clearRect(0, 0, w, h);
  // slight wobble lines (mimic crayon)
  ctx.font = `${size}px "Patrick Hand SC", "Patrick Hand", cursive`;
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.fillStyle = color;
  // shadow + main pass for chalky depth
  ctx.fillStyle = 'rgba(28,28,46,0.18)';
  ctx.fillText(text, w/2, h/2 + 4);
  ctx.fillStyle = color;
  ctx.fillText(text, w/2, h/2);
  const tex = new THREE.CanvasTexture(c);
  tex.colorSpace = THREE.SRGBColorSpace;
  tex.anisotropy = 4;
  const mesh = new THREE.Mesh(
    new THREE.PlaneGeometry(width, width / ratio),
    new THREE.MeshBasicMaterial({ map: tex, transparent: true, depthWrite: false })
  );
  mesh.rotation.x = -Math.PI / 2;
  mesh.position.y = 0.02;
  mesh.scale.setScalar(scale);
  return mesh;
}

/* ===========================================================
   WORLD OBJECTS — wood ramps, brick walls, project plinths
   We keep a registry of obstacles for AABB collision.
   =========================================================== */
const obstacles = [];      // {mesh, box: THREE.Box3, type, ...}
const ramps = [];          // {mesh, x, z, w, d, normal, angle, dir}
const triggers = [];       // proximity zones for project cards

const woodMat = new THREE.MeshStandardMaterial({ color: 0xc6915b, roughness: 0.85 });
const woodDarkMat = new THREE.MeshStandardMaterial({ color: 0x8a5a2f, roughness: 0.9 });
const brickMat  = new THREE.MeshStandardMaterial({ color: 0xc8513a, roughness: 0.9 });
const whiteMat  = new THREE.MeshStandardMaterial({ color: 0xfffdf6, roughness: 0.7 });
const inkMat    = new THREE.MeshStandardMaterial({ color: 0x2a2a35, roughness: 0.6 });
const accentMat = new THREE.MeshStandardMaterial({ color: 0xea3a1f, roughness: 0.6 });
const goldMat   = new THREE.MeshStandardMaterial({ color: 0xeeb845, metalness: 0.4, roughness: 0.35 });

/* --- Brick wall (with planks of mortar feel via mesh stripes) --- */
function addWall(x, z, w, d, h = 1.5, rot = 0) {
  const wall = new THREE.Mesh(new THREE.BoxGeometry(w, h, d), brickMat);
  wall.position.set(x, h/2, z);
  wall.rotation.y = rot;
  wall.castShadow = true; wall.receiveShadow = true;
  scene.add(wall);
  // mortar line on top
  const cap = new THREE.Mesh(new THREE.BoxGeometry(w + 0.1, 0.12, d + 0.1), whiteMat);
  cap.position.set(x, h + 0.06, z);
  cap.rotation.y = rot;
  cap.receiveShadow = true;
  scene.add(cap);
  const box = new THREE.Box3().setFromObject(wall);
  obstacles.push({ mesh: wall, box, type: 'wall' });
}

/* --- Wood ramp: a slanted wooden plank with diagonal planks --- */
function addRamp(x, z, w, d, h, dir = 'north') {
  // 'dir' tells us which side the bottom edge faces
  const group = new THREE.Group();
  // planks via thin stripes
  const planks = Math.max(3, Math.round(w / 0.7));
  const plankW = w / planks;
  for (let i = 0; i < planks; i++) {
    const p = new THREE.Mesh(
      new THREE.BoxGeometry(plankW * 0.94, 0.06, d),
      i % 2 === 0 ? woodMat : woodDarkMat
    );
    p.position.x = -w/2 + plankW/2 + i*plankW;
    p.castShadow = true; p.receiveShadow = true;
    group.add(p);
  }
  // tilt forward so its bottom edge meets the ground
  const angle = Math.atan2(h, d);
  group.rotation.x = -angle;
  // raise so the front edge sits on the ground
  group.position.set(x, h/2, z);
  // dir rotation
  if (dir === 'south') group.rotation.y = Math.PI;
  if (dir === 'east')  group.rotation.y =  Math.PI/2;
  if (dir === 'west')  group.rotation.y = -Math.PI/2;
  scene.add(group);
  // ramp record — XZ footprint for car-on-ramp height interpolation
  ramps.push({ x, z, w, d, h, dir, angle });
}

/* --- Simple project plinth: a colourful block + sign --- */
function addPlinth(x, z, color, label, projectMeta) {
  const w = 2.4, h = 1.4, d = 2.4;
  const mat = new THREE.MeshStandardMaterial({ color, roughness: 0.65 });

function joyStart(e) {
  joyActive = true; bumpInput();
}
function joyMove(e) {
  if (!joyActive) return;
  const t = e.touches ? e.touches[0] : e;
  const rect = joystick.getBoundingClientRect();
  const cx = rect.left + rect.width / 2;
  const cy = rect.top + rect.height / 2;
  let dx = t.clientX - cx;
  let dy = t.clientY - cy;
  const max = rect.width / 2 - 18;
  const len = Math.hypot(dx, dy);
  if (len > max) { dx = dx / len * max; dy = dy / len * max; }
  nub.style.left = `${50 + (dx / (rect.width/2)) * 50}%`;
  nub.style.top  = `${50 + (dy / (rect.height/2)) * 50}%`;
  joyVec.x = dx / max;
  joyVec.y = dy / max;
}
function joyEnd() {
  joyActive = false;
  nub.style.left = '50%'; nub.style.top = '50%';
  joyVec.x = 0; joyVec.y = 0;
}
joystick.addEventListener('touchstart', joyStart, { passive: true });
joystick.addEventListener('touchmove', joyMove, { passive: true });
joystick.addEventListener('touchend', joyEnd);
joystick.addEventListener('mousedown', joyStart);
window.addEventListener('mousemove', joyMove);
window.addEventListener('mouseup', joyEnd);

/* ===========================================================
   CAR DRIVING MODEL (custom mini-physics — toy feel)
   - longitudinal acceleration & exponential drag
   - steering angular velocity scales with speed (so it actually turns)
   - collision: AABB vs AABB; on hit, push out + dampen velocity
   - ramps: detect overlap, lerp Y up the ramp slope
   =========================================================== */
const carState = {
  pos: new THREE.Vector3(0, 0, 14),
  vel: 0,                  // forward velocity scalar
  heading: Math.PI,        // yaw radians; PI = facing -Z (north)
  steer: 0,                // current steer angle (rad) for visual wheel
  onRampY: 0,              // current ramp lift
};

const carHalf = new THREE.Vector3(0.95, 0.7, 1.65);

function getInputAxes() {
  let acc = 0, steer = 0;
  if (keys.up) acc += 1;
  if (keys.down) acc -= 1;
  if (keys.left) steer += 1;
  if (keys.right) steer -= 1;
  if (joyActive) {
    acc += -joyVec.y;                      // up on joystick = forward
    steer += -joyVec.x;
  }
  return { acc: Math.max(-1, Math.min(1, acc)), steer: Math.max(-1, Math.min(1, steer)) };
}

function updateCar(dt) {
  const { acc, steer } = getInputAxes();
  const accel = 28; // units / s^2
  const maxFwd = 22;
  const maxRev = 12;
  const drag = 1.4;
  const brake = 8;
  // Apply input
  if (acc !== 0) {
    carState.vel += acc * accel * dt;
  } else {
    // friction / drag
    const sign = Math.sign(carState.vel);
    carState.vel -= sign * drag * Math.abs(carState.vel) * dt;
    if (Math.abs(carState.vel) < 0.05) carState.vel = 0;
  }
  // Active brake if input opposes velocity
  if (acc !== 0 && Math.sign(acc) !== Math.sign(carState.vel) && Math.abs(carState.vel) > 0.1) {
    carState.vel -= Math.sign(carState.vel) * brake * dt;
  }
  carState.vel = Math.max(-maxRev, Math.min(maxFwd, carState.vel));

  // Steering — scaled with forward speed, signed by direction (so reversing feels right)
  const speedFactor = Math.min(1, Math.abs(carState.vel) / 4);
  const steerSpeed = 2.2 * speedFactor;
  carState.heading += steer * steerSpeed * dt * Math.sign(carState.vel || 1);
  // Visual wheel turn lerp
  carState.steer = THREE.MathUtils.lerp(carState.steer, steer * 0.5, 6 * dt);

  // Integrate position
  const forward = new THREE.Vector3(Math.sin(carState.heading), 0, Math.cos(carState.heading));
  const next = carState.pos.clone().addScaledVector(forward, carState.vel * dt);

  // World bounds (round arena)
  const r = 56;
  const distOut = Math.hypot(next.x, next.z);
  if (distOut > r) {
    const ang = Math.atan2(next.z, next.x);
    next.x = Math.cos(ang) * r;
    next.z = Math.sin(ang) * r;
    carState.vel *= 0.4;
  }

  // Ramp lift — if XZ inside any ramp, set Y
  let lift = 0;
  for (const ramp of ramps) {
    const dx = next.x - ramp.x;
    const dz = next.z - ramp.z;
    const localW = ramp.w / 2, localD = ramp.d / 2;
    let lx = dx, lz = dz;
    if (ramp.dir === 'south') { lx = -dx; lz = -dz; }
    if (ramp.dir === 'east')  { lx = dz;  lz = -dx; }
    if (ramp.dir === 'west')  { lx = -dz; lz =  dx; }
    if (Math.abs(lx) < localW && Math.abs(lz) < localD) {
      // lz = -localD at bottom (entry), +localD at top
      const t = (lz + localD) / (2 * localD); // 0..1
      lift = Math.max(lift, t * ramp.h);
    }
  }
  carState.onRampY = THREE.MathUtils.lerp(carState.onRampY, lift, 10 * dt);

  // AABB collision sliding
  const carBox = new THREE.Box3(
    new THREE.Vector3(next.x - carHalf.x, 0, next.z - carHalf.z),
    new THREE.Vector3(next.x + carHalf.x, carHalf.y * 2, next.z + carHalf.z)
  );
  for (const ob of obstacles) {
    if (carBox.intersectsBox(ob.box)) {
      // Compute overlap in X / Z, resolve along the smaller one
      const ox = Math.min(carBox.max.x, ob.box.max.x) - Math.max(carBox.min.x, ob.box.min.x);
      const oz = Math.min(carBox.max.z, ob.box.max.z) - Math.max(carBox.min.z, ob.box.min.z);
      if (ox < oz) {
        const sign = (carBox.min.x + carBox.max.x) / 2 < (ob.box.min.x + ob.box.max.x) / 2 ? -1 : 1;
        next.x += sign * ox;
      } else {
        const sign = (carBox.min.z + carBox.max.z) / 2 < (ob.box.min.z + ob.box.max.z) / 2 ? -1 : 1;
        next.z += sign * oz;
      }
      carState.vel *= 0.55;
    }
  }

  carState.pos.copy(next);

  // Apply to car group
  car.position.set(carState.pos.x, carState.onRampY, carState.pos.z);
  car.rotation.y = carState.heading;
  // Wobble tilt with steering at speed
  car.rotation.z = -carState.steer * 0.08 * speedFactor;
  // Pitch up the slope
  let pitch = 0;
  for (const ramp of ramps) {
    const dx = carState.pos.x - ramp.x;
    const dz = carState.pos.z - ramp.z;
    const localW = ramp.w / 2, localD = ramp.d / 2;
    let lx = dx, lz = dz;
    if (ramp.dir === 'south') { lx = -dx; lz = -dz; }
    if (ramp.dir === 'east')  { lx = dz;  lz = -dx; }
    if (ramp.dir === 'west')  { lx = -dz; lz =  dx; }
    if (Math.abs(lx) < localW && Math.abs(lz) < localD) {
      pitch = -ramp.angle;
      // direction-correct: 'north' = facing -Z; we want nose up when driving up
      // align with heading dot ramp forward
    }
  }
  car.rotation.x = THREE.MathUtils.lerp(car.rotation.x, pitch, 8 * dt);

  // Spin wheels
  const wheelSpin = carState.vel * dt * 2.6;
  wheels.forEach((w, i) => {
    w.rotation.x += wheelSpin;
    // Steer the FRONT wheels (first two)
    if (i < 2) w.rotation.y = carState.steer * 0.6;
  });

  // Triggers
  for (const t of triggers) {
    const d = Math.hypot(carState.pos.x - t.x, carState.pos.z - t.z);
    if (d < t.radius && !t.fired) {
      t.fired = true;
      showCard(t.meta);
    } else if (d > t.radius + 2) {
      t.fired = false;
    }
  }
}

   CHASE CAMERA
   =========================================================== */
const camTarget = new THREE.Vector3();
function updateCamera(dt) {
  const back = 14;
  const up = 9;
  const ix = -Math.sin(carState.heading) * back;
  const iz = -Math.cos(carState.heading) * back;
  const target = new THREE.Vector3(
    carState.pos.x + ix,
    up + carState.onRampY,
    carState.pos.z + iz
  );
  camera.position.lerp(target, Math.min(1, 4 * dt));
  camTarget.lerp(new THREE.Vector3(carState.pos.x, 1 + carState.onRampY, carState.pos.z), Math.min(1, 5 * dt));
  camera.lookAt(camTarget);
}

const loaderEl = document.getElementById('loader');

let progress = 0;
function tickLoader() {
  progress = Math.min(100, progress + 6 + Math.random()*9);
  barEl.style.width = progress + '%';
  if (progress < 100) requestAnimationFrame(tickLoader);
  else {
    setTimeout(() => loaderEl.classList.add('gone'), 250);
    setTimeout(() => loaderEl.remove(), 1200);
  }
}
requestAnimationFrame(tickLoader);

/* ===========================================================
   MAIN LOOP
   =========================================================== */
let last = performance.now();
function tick(now) {
  const dt = Math.min(0.05, (now - last) / 1000);
  last = now;
  updateCar(dt);
  updateCamera(dt);
  renderer.render(scene, camera);
  requestAnimationFrame(tick);
}
requestAnimationFrame(tick);

  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
});

<!--
  NOTES ON FIDELITY & TRADE-OFFS
  =======================================================================
  PRESERVED ESPECIALLY WELL
    • The DRIVE-A-CAR-AROUND signature — the page IS the interaction, exactly
      as on bruno-simon.com. Arrow keys → moves a chase-cam car through a
      hand-laid toy world.
    • Toy aesthetic: pastel sky, gridded shaded grass, plank-striped wood
      ramps, brick walls with mortar caps, crayon-style ground writing in
      Patrick Hand SC — same warmth Bruno's site radiates.
    • The intro overlay: BRUNO SIMON / Creative Developer + arrow-key prompt
      that auto-dismisses on the first input, identical pattern to the live
      site.
    • Project zones with proximity-triggered popup cards (Three.js Journey,
      Lego, Madbox), an AWARDS row with little gold trophies, and a CONTACT
      maze leading to the @ block — mirrors Bruno's island layout.
    • Forgiving car feel: speed-scaled steering, slide-on-collision, ramps
      you can actually drive up, soft chase camera, head/tail lights.

  INTENTIONAL TRADE-OFFS
    • No cannon-es / RaycastVehicle: full simulated suspension would have
      cost a heavier physics library and noisier tuning; I rolled a small
      custom driving model that captures the toy-springy feel deterministically.
    • No audio bed (Bruno has subtle engine + bump sounds): no royalty-free
      audio assets allowed in the brief, so the SOUND toggle is wired UI only.
    • Geometry is hand-laid boxes/cylinders rather than imported GLTF — the
